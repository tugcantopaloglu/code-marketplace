{{- if .Values.importer.enabled }}
{{- if .Values.persistence.artifactory.enabled }}
{{- fail "The offline importer requires local PVC storage" }}
{{- end }}
{{- if not (has .Values.importer.publisherPolicy.mode (list "verified" "allowlist" "any")) }}
{{- fail "importer.publisherPolicy.mode must be verified, allowlist, or any" }}
{{- end }}
{{- if not (has .Values.importer.sandboxMode (list "required" "disabled")) }}
{{- fail "importer.sandboxMode must be required or disabled" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "code-marketplace.fullname" . }}-importer
  labels:
    {{- include "code-marketplace.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.importer.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.importer.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "code-marketplace.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: importer
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          serviceAccountName: {{ include "code-marketplace.serviceAccountName" . }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: importer
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              args:
                - import
                - --incoming-dir
                - /incoming
                - --extensions-dir
                - /extensions
                - --sandbox-mode
                - {{ .Values.importer.sandboxMode | quote }}
                {{- if eq .Values.importer.sandboxMode "required" }}
                - --sandbox-trust
                - /sandbox-trust/trust.json
                - --sandbox-max-age
                - {{ .Values.importer.sandboxMaxAge | quote }}
                {{- end }}
                - --publisher-mode
                - {{ .Values.importer.publisherPolicy.mode | quote }}
                - --publisher-max-age
                - {{ .Values.importer.publisherPolicy.maxAge | quote }}
                {{- if ne .Values.importer.publisherPolicy.mode "any" }}
                - --publisher-policy
                - /publisher-policy/policy.json
                {{- end }}
              resources:
                {{- toYaml .Values.importer.resources | nindent 16 }}
              volumeMounts:
                - name: incoming
                  mountPath: /incoming
                  readOnly: true
                  {{- with .Values.importer.incoming.subPath }}
                  subPath: {{ . | quote }}
                  {{- end }}
                - name: published
                  mountPath: /extensions
                  {{- with .Values.persistence.subPath }}
                  subPath: {{ . | quote }}
                  {{- end }}
                {{- if eq .Values.importer.sandboxMode "required" }}
                - name: sandbox-trust
                  mountPath: /sandbox-trust
                  readOnly: true
                {{- end }}
                {{- if ne .Values.importer.publisherPolicy.mode "any" }}
                - name: publisher-policy
                  mountPath: /publisher-policy
                  readOnly: true
                {{- end }}
          volumes:
            - name: incoming
              persistentVolumeClaim:
                claimName: {{ required "importer.incoming.existingClaim is required" .Values.importer.incoming.existingClaim }}
            - name: published
              persistentVolumeClaim:
                claimName: {{ .Values.persistence.existingClaim | default (include "code-marketplace.fullname" .) }}
            {{- if eq .Values.importer.sandboxMode "required" }}
            - name: sandbox-trust
              configMap:
                name: {{ required "importer.sandboxTrust.configMap is required" .Values.importer.sandboxTrust.configMap }}
                items:
                  - key: {{ .Values.importer.sandboxTrust.key | quote }}
                    path: trust.json
            {{- end }}
            {{- if ne .Values.importer.publisherPolicy.mode "any" }}
            - name: publisher-policy
              configMap:
                name: {{ include "code-marketplace.publisherPolicyName" . }}
                items:
                  - key: {{ .Values.importer.publisherPolicy.key | quote }}
                    path: policy.json
            {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
