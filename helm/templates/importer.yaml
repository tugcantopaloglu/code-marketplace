{{- if .Values.importer.enabled }}
{{- if .Values.persistence.artifactory.enabled }}
{{- fail "The offline importer requires local PVC storage" }}
{{- end }}
{{- if not (has .Values.importer.publisherPolicy.mode (list "verified" "allowlist" "any")) }}
{{- fail "importer.publisherPolicy.mode must be verified, allowlist, or any" }}
{{- end }}
{{- if not (has .Values.importer.sandboxMode (list "required" "disabled")) }}
{{- fail "importer.sandboxMode must be required or disabled" }}
{{- end }}
{{- $internalEnabled := not (empty .Values.importer.internalPolicy.configMap) }}
{{- $autoSign := .Values.importer.internalAutoSign }}
{{- if and (hasKey $autoSign "skipSandbox") (not (kindIs "bool" $autoSign.skipSandbox)) }}
{{- fail "importer.internalAutoSign.skipSandbox must be a boolean" }}
{{- end }}
{{- $sandboxTrustRequired := or (eq .Values.importer.sandboxMode "required") (and $internalEnabled (not $autoSign.skipSandbox)) }}
{{- $mountSandboxTrust := or $sandboxTrustRequired (and $internalEnabled (not (empty .Values.importer.sandboxTrust.configMap))) }}
{{- if and $autoSign.skipSandbox (not $autoSign.secretName) }}
{{- fail "importer.internalAutoSign.skipSandbox requires automatic internal signing" }}
{{- end }}
{{- if and $autoSign.secretName (not $internalEnabled) }}
{{- fail "automatic internal signing requires importer.internalPolicy.configMap" }}
{{- end }}
{{- if and $autoSign.secretName (not (regexMatch "^[1-9][0-9]{0,9}$" (toString $autoSign.uploaderUid))) }}
{{- fail "automatic internal signing requires importer.internalAutoSign.uploaderUid to be a positive Linux UID" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "code-marketplace.fullname" . }}-importer
  labels:
    {{- include "code-marketplace.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.importer.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.importer.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "code-marketplace.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: importer
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          serviceAccountName: {{ include "code-marketplace.serviceAccountName" . }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: importer
              command: ["code-marketplace"]
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              args:
                - import
                - --incoming-dir
                - /incoming
                - --extensions-dir
                - /extensions
                {{- if .Values.importer.processed.enabled }}
                - --processed-dir
                - /processed
                {{- end }}
                {{- if .Values.importer.writeIncomingReport }}
                - --write-incoming-report
                {{- end }}
                - --sandbox-mode
                - {{ .Values.importer.sandboxMode | quote }}
                {{- if $mountSandboxTrust }}
                - --sandbox-trust
                - /sandbox-trust/trust.json
                - --sandbox-max-age
                - {{ .Values.importer.sandboxMaxAge | quote }}
                {{- end }}
                {{- if $internalEnabled }}
                - --internal-policy
                - /internal-policy/policy.json
                {{- end }}
                {{- if $autoSign.secretName }}
                - --internal-auto-sign-key
                - /internal-auto-sign/internal-private.pem
                - --internal-auto-sign-key-id
                - {{ required "importer.internalAutoSign.keyId is required" $autoSign.keyId | quote }}
                - --internal-uploader-uid
                - {{ $autoSign.uploaderUid | quote }}
                {{- if $autoSign.skipSandbox }}
                - --internal-auto-skip-sandbox
                {{- end }}
                {{- end }}
                - --publisher-mode
                - {{ .Values.importer.publisherPolicy.mode | quote }}
                - --publisher-max-age
                - {{ .Values.importer.publisherPolicy.maxAge | quote }}
                {{- if ne .Values.importer.publisherPolicy.mode "any" }}
                - --publisher-policy
                - /publisher-policy/policy.json
                {{- end }}
              resources:
                {{- toYaml .Values.importer.resources | nindent 16 }}
              volumeMounts:
                - name: incoming
                  mountPath: /incoming
                  readOnly: {{ not (or .Values.importer.processed.enabled .Values.importer.writeIncomingReport $autoSign.secretName) }}
                  {{- with .Values.importer.incoming.subPath }}
                  subPath: {{ . | quote }}
                  {{- end }}
                - name: published
                  mountPath: /extensions
                  {{- with .Values.persistence.subPath }}
                  subPath: {{ . | quote }}
                  {{- end }}
                {{- if .Values.importer.processed.enabled }}
                - name: processed
                  mountPath: /processed
                  subPath: {{ required "importer.processed.subPath is required" .Values.importer.processed.subPath | quote }}
                {{- end }}
                {{- if $mountSandboxTrust }}
                - name: sandbox-trust
                  mountPath: /sandbox-trust
                  readOnly: true
                {{- end }}
                {{- if $internalEnabled }}
                - name: internal-policy
                  mountPath: /internal-policy
                  readOnly: true
                {{- end }}
                {{- if $autoSign.secretName }}
                - name: internal-auto-sign
                  mountPath: /internal-auto-sign
                  readOnly: true
                {{- end }}
                {{- if ne .Values.importer.publisherPolicy.mode "any" }}
                - name: publisher-policy
                  mountPath: /publisher-policy
                  readOnly: true
                {{- end }}
          volumes:
            - name: incoming
              persistentVolumeClaim:
                claimName: {{ required "importer.incoming.existingClaim is required" .Values.importer.incoming.existingClaim }}
            - name: published
              persistentVolumeClaim:
                claimName: {{ .Values.persistence.existingClaim | default (include "code-marketplace.fullname" .) }}
            {{- if .Values.importer.processed.enabled }}
            - name: processed
              persistentVolumeClaim:
                claimName: {{ .Values.importer.processed.existingClaim | default .Values.importer.incoming.existingClaim }}
            {{- end }}
            {{- if $mountSandboxTrust }}
            - name: sandbox-trust
              configMap:
                name: {{ required "importer.sandboxTrust.configMap is required" .Values.importer.sandboxTrust.configMap }}
                items:
                  - key: {{ .Values.importer.sandboxTrust.key | quote }}
                    path: trust.json
            {{- end }}
            {{- if $internalEnabled }}
            - name: internal-policy
              configMap:
                name: {{ .Values.importer.internalPolicy.configMap | quote }}
                items:
                  - key: {{ .Values.importer.internalPolicy.key | quote }}
                    path: policy.json
            {{- end }}
            {{- if $autoSign.secretName }}
            - name: internal-auto-sign
              secret:
                secretName: {{ $autoSign.secretName | quote }}
                defaultMode: 288
                items:
                  - key: {{ $autoSign.secretKey | quote }}
                    path: internal-private.pem
            {{- end }}
            {{- if ne .Values.importer.publisherPolicy.mode "any" }}
            - name: publisher-policy
              configMap:
                name: {{ include "code-marketplace.publisherPolicyName" . }}
                items:
                  - key: {{ .Values.importer.publisherPolicy.key | quote }}
                    path: policy.json
            {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
