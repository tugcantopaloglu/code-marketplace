name: offline bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image version, for example v2.6.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - run: go test -short ./...
      - name: Create offline bundle
        env:
          BUNDLE_VERSION: ${{ inputs.version }}
          BUNDLE_ARCH: ${{ matrix.architecture }}
          SOURCE_URL: https://github.com/${{ github.repository }}
        run: bash scripts/export-offline.sh "$BUNDLE_VERSION" offline-output "$BUNDLE_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: code-marketplace-offline-${{ matrix.architecture }}
          path: offline-output/
          retention-days: 30
