name: offline bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image version, for example v2.6.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - run: go test -short ./...
      - name: Create offline bundle
        env:
          BUNDLE_VERSION: ${{ inputs.version }}
          BUNDLE_ARCH: ${{ matrix.architecture }}
          SOURCE_URL: https://github.com/${{ github.repository }}
        run: bash scripts/export-offline.sh "$BUNDLE_VERSION" offline-output "$BUNDLE_ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: code-marketplace-offline-${{ matrix.architecture }}
          path: offline-output/
          retention-days: 30
