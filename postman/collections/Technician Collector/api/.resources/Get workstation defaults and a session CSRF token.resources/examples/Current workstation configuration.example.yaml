$kind: http-example
request:
  url: "{{baseUrl}}/api/session"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "csrfToken": "string",
        "destination": "string",
        "platform": "string"
      }
order: 1000
